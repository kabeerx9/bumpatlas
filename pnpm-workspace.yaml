packages:
  - apps/*
  - packages/*
allowBuilds:
  esbuild: true
  msw: true
  msgpackr-extract: true
  "@prisma/engines": true
  prisma: true
  browser-tabs-lock: false
  bufferutil: false
  core-js: false
  utf-8-validate: false
catalog:
  dotenv: ^17.2.2
  zod: ^4.1.13
  typescript: ^6
  "@types/node": ^22.13.14
  next-themes: ^0.4.6
  "@types/react-dom": ^19.2.3
minimumReleaseAgeExclude:
  - '@expo/cli@55.0.33'
  - '@expo/config@55.0.18'
  - '@expo/local-build-cache-provider@55.0.14'
  - '@expo/metro-config@55.0.24'
  - '@expo/prebuild-config@55.0.19'
  - babel-preset-expo@55.0.23
  - expo-application@55.0.16
  - expo-auth-session@55.0.17
  - expo-crypto@55.0.16
  - expo-dev-client@55.0.36
  - expo-dev-launcher@55.0.37
  - expo-dev-menu@55.0.31
  - expo-file-system@55.0.23
  - expo-linking@55.0.16
  - expo-manifests@55.0.18
  - expo-network@55.0.15
  - expo-secure-store@55.0.15
  - expo-splash-screen@55.0.22
  - expo-system-ui@55.0.19
  - expo-web-browser@55.0.17
  - expo@55.0.27
