<!-- Landing hero structure -->
<div style="position:relative;padding:96px 40px 88px;text-align:center;overflow:hidden">
  <div style="position:absolute;top:-140px;left:50%;transform:translateX(-50%);width:520px;height:520px;border-radius:50%;background:oklch(58% 0.09 150);opacity:.07"></div>
  <h1 style="font-size:44px;line-height:1.15;font-weight:600">One meaningful moment. One small step for yourself.</h1>
  <p>Capture one meaningful moment, take one small step for yourself — in a few calm minutes a day.</p>
  <!-- CTAs: filled sage "Get started" (14px 28px pad, r10) + bordered "Sign in" -->
</div>
